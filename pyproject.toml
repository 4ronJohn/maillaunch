[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maillaunch"
version = "0.1.0"
description = "CLI cold email campaign tool for Gmail and Microsoft Graph"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "keyring>=25.0,<26",
    "requests>=2.31,<3",
    "google-auth>=2.29,<3",
    "google-auth-oauthlib>=1.2,<2",
    "msal>=1.28,<2",
]

[project.scripts]
maillaunch = "main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}
